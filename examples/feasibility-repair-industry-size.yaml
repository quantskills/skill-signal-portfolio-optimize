schema_version: 5
signal:
  type: rank_score
  higher_is_better: true
  winsorize_mad: 5.0
  zscore: true
  rank_transform: normal_score
  rank_power: 1.0
  annualized_alpha_scale: 0.05
  missing_prediction_policy: role_aware
  minimum_daily_signal_count_ratio: 0.80
optimizer:
  objective_mode: lexicographic_signal_cost
  solver_backend: clarabel_socp
  risk_aversion: 5.0
  turnover_penalty: 0.001
  smoothing_epsilon: 1.0e-8
  max_iterations: 4000
  ftol: 1.0e-9
  minimum_signal_capture: 0.995
  minimum_alpha_capture: 0.0
  alpha_reward_weight: 0.0
  stability_penalty: 1.0e-8
  warm_start: true
  conic_cache_size: 8
  fallback_policy: error
  max_cutting_planes: 100
  blend_strength: 0.0
  feasibility_mode: repair
constraints:
  max_weight: 0.002
  max_active_weight: 0.04
  max_turnover: 0.20
  max_tracking_error: 0.06
  industry_active_range:
    default: {min_active: -0.01, max_active: 0.01}
  style_active_ranges:
    SIZE: {enabled: true, target_active: 0.0, tolerance: 0.10}
  candidate_weight_range: null
  initial_cash_turnover_exempt: true
  frozen_active_band_exemption: true
baseline:
  top_n: 500
