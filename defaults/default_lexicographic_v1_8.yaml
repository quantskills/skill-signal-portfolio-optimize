# 锁定默认配置 v2（2026-09-26）
# 相对 v1（TE8%/换手20%）的两处改动，均基于时间切分实验与后续扩样验证：
#   max_tracking_error: 0.08 -> 0.06
#     方案 A（默认 vs TE6，15 个相互独立的信号评价）：Sharpe 14/15 改善（平均 +0.348，跨评价 t=+4.25，p=0.0005）；
#     相对回撤 15/15 下降（平均 -3.05pp，t=+12.9）；代价为收益水平 -2.04%/年（t=-2.89）。
#   max_turnover: 0.20 -> 0.12
#     2 倍线性成本压力测试与 ADV 平方根冲击成本事后核算均显示低换手档相对占优；
#     组合层面 TE6+换手12% 事前 ΔSharpe +0.18、冲击后（η=1.0）ΔSharpe +0.60（5/6 评价为正）。
#   frozen_active_band_exemption: true
#     修复"停牌持仓冻结 + 行业主动带"导致可行域为空、调仓失败的问题（2024-10-28 等日期实测）。
# 证据与复现：experiments/tsplit_resel300_study_v1/README.md 与 reports/时间切分验证_2024调参_2025-2026验证.docx
schema_version: 5
signal:
  type: rank_score
  higher_is_better: true
  winsorize_mad: 5.0
  zscore: true
  rank_transform: normal_score
  rank_power: 1.0
  annualized_alpha_scale: 0.05
  missing_prediction_policy: role_aware
  minimum_daily_signal_count_ratio: 0.8
covariance:
  risk_form: factor_model
  annualized: true
  periods_per_year: 252
  eigenvalue_floor: 1.0e-10
  symmetry_tolerance: 1.0e-10
optimizer:
  objective_mode: lexicographic_signal_cost
  solver_backend: clarabel_socp
  risk_aversion: 5.0
  turnover_penalty: 0.001
  smoothing_epsilon: 1.0e-08
  max_iterations: 4000
  ftol: 1.0e-09
  minimum_signal_capture: 0.995
  stability_penalty: 1.0e-08
  warm_start: true
  conic_cache_size: 8
  fallback_policy: error
  max_cutting_planes: 100
cost_model:
  linear_cost_bps: 7.0
constraints:
  max_weight: 0.04
  max_active_weight: 0.04
  max_turnover: 0.12
  max_tracking_error: 0.06
  sector_active_limit: null
  factor_active_limit: null
  industry_active_range:
    default:
      min_active: -0.02
      max_active: 0.02
  style_active_ranges:
    SIZE:
      enabled: true
      target_active: 0.0
      tolerance: 5.0
    BETA:
      enabled: true
      target_active: 0.0
      tolerance: 0.3
    MOMENTUM:
      enabled: false
    RESVOL:
      enabled: false
    NLSIZE:
      enabled: false
  candidate_weight_range: null
  weight_sum_tolerance: 1.0e-08
  constraint_tolerance: 1.0e-05
  frozen_active_band_exemption: true
baseline:
  top_n: 50
